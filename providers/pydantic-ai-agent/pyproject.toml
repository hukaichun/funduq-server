[project]
name = "pydantic-ai-agent"
version = "0.1.0"
description = "Example souk provider: config (system prompt + MCP servers + sub-agents) in, souk-connected AG-UI agent out, built on pydantic-ai. One of several provider examples under providers/ — see providers/README.md."
requires-python = ">=3.12"
# Apache-2.0, not the repo's AGPL-3.0. A reference provider is something
# to start from, same as agent-template.
license = "Apache-2.0"
license-files = ["LICENSE"]

# Not for an index. This package depends on a sibling in this repo by bare
# name (souk-agent-sdk), resolvable only through the [tool.uv.sources] path below —
# uploaded anywhere, that name would resolve to whatever a stranger has
# published under it. PyPI refuses an unrecognised classifier, which is what
# makes this line a guard rather than a comment. Remove it when souk-agent-sdk is
# genuinely published and this can name a real version.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "souk-agent-sdk",
    # Imported directly (KyokForwardedProps in main.py) — declared here
    # rather than leaned on transitively through souk-agent-sdk. No [llm]
    # extra: only the props model is used, never the llm module.
    "funduq-provider-sdk>=0.0.7,<0.1",
    "pydantic-ai[ag-ui]>=0.0.49",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Used directly by pydantic_ai_agent.souk_tools — already pulled in
    # transitively via souk-agent-sdk, declared explicitly since this
    # project imports it itself, not just through that dependency.
    "httpx>=0.27",
]

[tool.uv.sources]
souk-agent-sdk = { path = "../../souk-agent-sdk" }

[project.scripts]
pydantic-ai-agent = "pydantic_ai_agent.main:run"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_agent"]
