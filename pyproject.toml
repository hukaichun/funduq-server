[project]
name = "souk-server"
version = "0.1.0"
description = "The reference funduq gateway: AG-UI + A2A over HTTP, and the WebSocket relays providers and KYOK bridges connect out to"
requires-python = ">=3.12"
# AGPL-3.0, and for a gateway that is the choice with teeth. Every other
# strong copyleft licence is satisfied by never shipping a binary, which
# is exactly what running a server is — §13 is the clause that closes it:
# someone who modifies this and lets people talk to it over a network owes
# them the modified source, whether or not they ever distribute a copy.
#
# funduq core is Apache-2.0 upstream and stays that way. Apache-2.0 is
# one-way compatible with (A)GPLv3, so an AGPL work may include it; the
# reverse is not true, which is why the licence lives on this side of the
# boundary and not upstream.
#
# The SDKs, the template and the reference providers in this repo are
# Apache-2.0 instead, each with its own LICENSE: a library a third party
# imports into their own agent is not a server, and AGPL there would
# oblige every provider author to publish their agent. See LICENSING.md.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# This is where every I/O decision lives — which framework, which port,
# which TLS story — and why it is a separate distribution rather than an
# extra of `funduq`: core cannot grow a uvicorn import without someone
# noticing they are in the wrong package.
#
# Upstream arrives from PyPI now — the AgentSouk submodule is gone.
# `<0.1` on all three: upstream is pre-1.0 and bumps the contract
# revision inside the 0.0.x line; docs/contract-changelog.md upstream is
# the record to read before widening these.
dependencies = [
    "funduq>=0.0.6,<0.1",
    # The AG-UI wire model both ends of every run frame validate against.
    # Pinned with a floor here, and not left to whatever each subproject's
    # lock happened to resolve: `funduq-contract` floors it at >=0.1, and
    # 0.1.22 made `RunAgentInput.state` optional-and-omitted-when-unset
    # while 0.1.19 still requires it — so a gateway on one and a provider
    # on the other disagree about a frame neither contract revision nor
    # any test in one process can catch. It cost a full stack run to find
    # (funduq#243).
    "ag-ui-protocol>=0.1.22",
    # Upstream states the provider contract itself — identity, the
    # ports, and the provider's own loop, with no transport in it. This
    # gateway builds the socket around exactly that contract. The KYOK
    # side is the same package's `llm` extra (`funduq_provider_sdk.llm`).
    "funduq-provider-sdk[llm]>=0.0.7,<0.1",
    # The signing vocabulary both ends verify: connect payloads, actor
    # chains, CONTRACT_REVISION.
    "funduq-contract>=0.0.9,<0.1",
    "fastapi>=0.115",
    # ServingSettings reads SOUK_* from the environment; funduq's own
    # CoreSettings stopped being a settings model, so nothing upstream
    # carries this in any more.
    "pydantic-settings>=2.6",
    # The A2A door mounts a2a-sdk's JSON-RPC dispatcher over core's typed
    # adapter — core stopped speaking JSON-RPC itself.
    "a2a-sdk>=1.1,<2",
    # [standard] brings websockets, which serves /ws/provider and /ws/kyok
    # — the ws relays need no dependency of their own.
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
# Passed through to funduq itself — a gateway wanting the Postgres backend
# installs `souk-server[postgres]` rather than reaching past this package.
postgres = ["funduq[postgres]"]

[project.scripts]
souk-server = "souk_server.server:main"

[tool.uv.sources]
# Dev only, and only for one test. Every KYOK test in this repo writes the
# signing payload out by hand — deliberately, so a change to core's is
# caught by a disagreement rather than propagated by a shared helper — but
# that independence also means none of them would go red if
# `KyokSigningAuth`, the object a real provider attaches to its OpenAI
# client, drifted from core. One test using the shipped signer against the
# real app closes that, and this is what it costs.
souk-agent-sdk = { path = "souk-agent-sdk", editable = true }

# httpx drives the ASGI app in tests without binding a port; httpx-ws does
# the same for the two WebSocket relays.
[dependency-groups]
dev = [
    "souk-agent-sdk",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    # No direct alembic dependency: the migration chain ships inside
    # funduq (`python -m funduq.migrate`), which carries its own alembic.
    "httpx-ws>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only this repo's gateway suite — the subprojects run their own.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_server"]
