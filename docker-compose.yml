services:
  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: souk
      POSTGRES_PASSWORD: souk
      POSTGRES_DB: souk
    ports:
      - "5433:5432"
    volumes:
      - paradedb_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U souk -d souk"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: applies funduq's alembic chain (DDL) against paradedb, then
  # exits. Split out from the `souk` service below on purpose — the
  # gateway itself never runs DDL at startup (see souk_server/server.py),
  # so a real deployment runs this step separately with DDL-capable
  # credentials and gives the running server a DML-only role instead.
  # Local dev reuses the same `souk` Postgres user for both here, for
  # simplicity only.
  #
  # `python -m funduq.migrate`: the chain ships inside the funduq wheel
  # (there is deliberately no alembic.ini anywhere and no create-tables
  # path) — the built image's own `uv run` finds `funduq:alembic`
  # wherever the package is installed. Reads FUNDUQ_DATABASE_URL /
  # FUNDUQ_DB_SCHEMA from the environment below.
  souk-migrate:
    # Same image tag as `souk` below (which shares this same build config)
    # so Compose builds it once, not twice, under two different names.
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["uv", "run", "python", "-m", "funduq.migrate"]
    depends_on:
      paradedb:
        condition: service_healthy
    environment:
      FUNDUQ_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      # Passes a host-exported FUNDUQ_DB_SCHEMA through into the container
      # — Compose does NOT forward arbitrary host env vars on its own,
      # only ones a service's `environment:` explicitly references like
      # this. Defaults to `public` (funduq.db_schema's own default).
      FUNDUQ_DB_SCHEMA: ${FUNDUQ_DB_SCHEMA:-public}

  souk:
    image: agentsouk-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      souk-migrate:
        condition: service_completed_successfully
    environment:
      FUNDUQ_DATABASE_URL: postgresql+psycopg://souk:souk@paradedb:5432/souk
      SOUK_PUBLIC_HTTP_URL: http://localhost:8000
      # No default in funduq's config for this one — a predictable JWT
      # signing key is a real auth bypass. This value is only fine because
      # it's this repo's own local-dev stack; a real deployment must set
      # its own via FUNDUQ_TOKEN_SIGNING_SECRET.
      FUNDUQ_TOKEN_SIGNING_SECRET: dev-insecure-change-me
      # This funduq's own Ed25519 identity — REQUIRED now: providers pin
      # it and the ticket handshake binds every connect proof to it.
      # Fixed here so the value below can be a provider's pinned key; a
      # real deployment generates its own (`FunduqIdentity.generate_hex()`)
      # and provisions it like any other secret. A value rather than a
      # file because every replica of one funduq must present the same
      # identity, and because it has to survive a container that owns no
      # volume.
      FUNDUQ_IDENTITY_PRIVATE_KEY: ${FUNDUQ_IDENTITY_PRIVATE_KEY:-ed2f1426228cc76fdceb83066aad7b5f27011d98240ebee9bd28afb31952f9e3}
      # Must match souk-migrate's above — see that service's comment.
      FUNDUQ_DB_SCHEMA: ${FUNDUQ_DB_SCHEMA:-public}
    # /readyz, because it reports what a provider about to register
    # actually needs (database reachable, dispatch running) — /healthz
    # only proves the process answers. python urllib rather than curl:
    # the image is python-slim and ships no curl/wget.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The stall at the gate: the guide that knows who else is here. An
  # ordinary provider — own key, own row in the roster, work claimed over
  # WS /ws/provider — that reaches the market through the gateway's own
  # MCP surface (/mcp) rather than GET /agents, which is what makes it
  # the first real consumer of that surface rather than a special case.
  #
  # Needs an LLM: copy .env.example to .env and fill in LLM_BASE_URL /
  # LLM_API_KEY / LLM_MODEL_NAME (or ANTHROPIC_API_KEY and change the
  # config's `model:`). Compose reads .env from this directory for the
  # ${...} below.
  docent:
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      # service_healthy, not just created: the SDK's reconnect loop
      # absorbs a not-yet-listening souk anyway, but each failed attempt
      # printed a full httpx.ConnectError traceback one line above the
      # eventual "201 Created" — a page of red that reads as a real
      # failure to anyone watching the logs. Same standard the `souk`
      # service already applies to souk-migrate.
      souk:
        condition: service_healthy
    volumes:
      - ./providers/pydantic-ai-agent/config.docent.yaml:/app/config.yaml:ro
      # Without this the docent mints a fresh Ed25519 identity on every
      # recreate, and the old one's row is left in the roster as an orphan
      # — two "docent" entries under two different keys, one of them
      # permanently offline. Persisting the key is what makes `docker
      # compose up --build` idempotent: an agent is `(provider_key,
      # name)`, so a new key is a new agent no matter what it calls
      # itself.
      - docent_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      # The souk this provider will talk to, pinned. Refuses to hand its
      # proof to anything else answering that URL. See the `souk`
      # service's SOUK_IDENTITY_PRIVATE_KEY — this is its public half.
      SOUK_PUBLIC_KEY: ${SOUK_PUBLIC_KEY:-6ecc7c33af8471e478777041e0fdf9662ba6f76c3044365ce16a7b09c476e506}
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  # --- the demo market: `docker compose --profile demo up` -------------
  #
  # Off by default so the plain stack stays small (and cheap: each of
  # these is an LLM-backed agent, though an idle one spends nothing — it
  # only claims). Together with the docent they make a market with more
  # than one thing in it, which is what a frontend cannot be built
  # against otherwise. What each is here to exercise:
  #
  #   zahra    two agents in one stall, and a cross-stall A2A delegation
  #            (its haggler calls Yusuf's scribe)
  #   yusuf    two agents, one of them sharing the display name
  #            "translator" with Zahra's — a genuinely ambiguous name,
  #            which the docent refuses to guess at and a directory must
  #            render as a choice rather than a winner
  #   teahouse a single-agent stall, a different card from the other two
  #
  # Each is its own provider identity, which is what makes them separate
  # stalls rather than one stall with five agents — hence a volume each
  # for the key (see the docent's own comment on why that matters).
  zahra:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      # service_healthy, not just created: the SDK's reconnect loop
      # absorbs a not-yet-listening souk anyway, but each failed attempt
      # printed a full httpx.ConnectError traceback one line above the
      # eventual "201 Created" — a page of red that reads as a real
      # failure to anyone watching the logs. Same standard the `souk`
      # service already applies to souk-migrate.
      souk:
        condition: service_healthy
    volumes:
      - ./providers/pydantic-ai-agent/config.zahra.yaml:/app/config.yaml:ro
      - zahra_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      # The souk this provider will talk to, pinned. Refuses to hand its
      # proof to anything else answering that URL. See the `souk`
      # service's SOUK_IDENTITY_PRIVATE_KEY — this is its public half.
      SOUK_PUBLIC_KEY: ${SOUK_PUBLIC_KEY:-6ecc7c33af8471e478777041e0fdf9662ba6f76c3044365ce16a7b09c476e506}
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  yusuf:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      # service_healthy, not just created: the SDK's reconnect loop
      # absorbs a not-yet-listening souk anyway, but each failed attempt
      # printed a full httpx.ConnectError traceback one line above the
      # eventual "201 Created" — a page of red that reads as a real
      # failure to anyone watching the logs. Same standard the `souk`
      # service already applies to souk-migrate.
      souk:
        condition: service_healthy
    volumes:
      - ./providers/pydantic-ai-agent/config.yusuf.yaml:/app/config.yaml:ro
      - yusuf_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      # The souk this provider will talk to, pinned. Refuses to hand its
      # proof to anything else answering that URL. See the `souk`
      # service's SOUK_IDENTITY_PRIVATE_KEY — this is its public half.
      SOUK_PUBLIC_KEY: ${SOUK_PUBLIC_KEY:-6ecc7c33af8471e478777041e0fdf9662ba6f76c3044365ce16a7b09c476e506}
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  teahouse:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: providers/pydantic-ai-agent/Dockerfile
    depends_on:
      # service_healthy, not just created: the SDK's reconnect loop
      # absorbs a not-yet-listening souk anyway, but each failed attempt
      # printed a full httpx.ConnectError traceback one line above the
      # eventual "201 Created" — a page of red that reads as a real
      # failure to anyone watching the logs. Same standard the `souk`
      # service already applies to souk-migrate.
      souk:
        condition: service_healthy
    volumes:
      - ./providers/pydantic-ai-agent/config.teahouse.yaml:/app/config.yaml:ro
      - teahouse_identity:/data
    environment:
      SOUK_IDENTITY_KEY_PATH: /data/souk_identity.key
      # The souk this provider will talk to, pinned. Refuses to hand its
      # proof to anything else answering that URL. See the `souk`
      # service's SOUK_IDENTITY_PRIVATE_KEY — this is its public half.
      SOUK_PUBLIC_KEY: ${SOUK_PUBLIC_KEY:-6ecc7c33af8471e478777041e0fdf9662ba6f76c3044365ce16a7b09c476e506}
      LLM_BASE_URL: "${LLM_BASE_URL}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME}"
      LLM_API_KEY: "${LLM_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

  # The frontend: a human-browsable directory for this souk, and the thing
  # that makes the stack visible to a person rather than to curl. Open
  # http://localhost:8080/index.html once the stack is up.
  #
  # Deliberately has no `depends_on` and no souk URL in its environment.
  # It is a pure static server — the compiled page talks to the gateway
  # from the *browser*, so the URL that matters is the one the user's
  # machine can reach (http://localhost:8000, which `souk` publishes
  # above and which src/app.ts already defaults to), never a
  # compose-internal hostname. `?souk=` overrides it for any other
  # gateway. Nothing here needs souk to be up to start, and the page says
  # so itself when the gateway is missing.
  souk-directory:
    build:
      context: ./souk-directory
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  # A binary agent standing in for one dropped inside a pod: it dials out to
  # souk, registers, and answers read-only questions about the container it
  # lives in — no inbound port, no LLM key of its own, no way to change
  # anything it inspects (docs/server-mode.md's frame protocol, no SDK). In
  # a real cluster you would put one of these in each pod; here it inspects
  # a repo directory mounted read-only at /app, which stands in for the
  # pod's app dir, so "what was modified after the pod started" has real
  # files with real mtimes to report. Needs no LLM: with none configured it
  # returns the raw read-only report, which is the mode the wire is verified
  # in. Give it a KYOK-opted-in run (metadata.kyok) and it will have a model
  # interpret those facts, paid for with the caller's key.
  pod-probe:
    profiles: ["probe"]
    build:
      context: ./providers/pod-probe-agent
      dockerfile: Dockerfile
    depends_on:
      - souk
    volumes:
      - probe_identity:/data
      # The subtree the probe treats as the pod's app dir. Read-only, and
      # the agent could not write it even if it were not — it has no write
      # path at all.
      - ./providers:/app:ro
    environment:
      SOUK_HTTP_URL: http://souk:8000
      SOUK_IDENTITY_KEY_PATH: /data/probe_identity.key
      PROBE_AGENT_NAME: pod-probe-demo
      PROBE_PROVIDER_NAME: pod probe
      PROBE_ROOT: /app
      # The souk this probe pins — refuses to hand its proof to anything
      # else answering that URL. Public half of the `souk` service's
      # SOUK_IDENTITY_PRIVATE_KEY.
      SOUK_PUBLIC_KEY: ${SOUK_PUBLIC_KEY:-6ecc7c33af8471e478777041e0fdf9662ba6f76c3044365ce16a7b09c476e506}

volumes:
  paradedb_data:
  docent_identity:
  zahra_identity:
  yusuf_identity:
  teahouse_identity:
  probe_identity:
