[project]
name = "souk-agent-sdk"
version = "0.1.0"
description = "Agent-side SDK: registers a batch of AG-UI-shaped agents with a souk and serves runs over its WebSocket relay"
requires-python = ">=3.12"
# Apache-2.0, not the repo's AGPL-3.0. This is a library a provider
# author imports into their own agent, and AGPL there would oblige them
# to publish that agent — which would stop anyone building a proprietary
# agent against this souk, and is not what the gateway's licence is for.
# Matches souk core upstream, and composes into the AGPL gateway (that
# direction works; the reverse does not).
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    # What a provider *is* — identity, the port, the loop. This package
    # is only the socket around it. From PyPI now; the signing payloads
    # it re-exports come from funduq-contract underneath.
    "funduq-provider-sdk>=0.0.8,<0.1",
    # The AG-UI wire model both ends of every run frame validate against.
    # Pinned with a floor here, and not left to whatever each subproject's
    # lock happened to resolve: `funduq-contract` floors it at >=0.1, and
    # 0.1.22 made `RunAgentInput.state` optional-and-omitted-when-unset
    # while 0.1.19 still requires it — so a gateway on one and a provider
    # on the other disagree about a frame neither contract revision nor
    # any test in one process can catch. It cost a full stack run to find
    # (funduq#243).
    "ag-ui-protocol>=0.1.22",
    # The work socket (WS /ws/provider — the frame protocol is authored
    # in the gateway repo's docs/server-mode.md).
    "websockets>=13",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "cryptography>=42.0",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_agent_sdk"]
