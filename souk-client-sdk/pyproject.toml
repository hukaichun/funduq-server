[project]
name = "souk-client-sdk"
version = "0.1.0"
description = "Caller-side SDK: a thin AG-UI client for talking to agents through a souk"
requires-python = ">=3.12"
# Apache-2.0, not the repo's AGPL-3.0. This is what a *caller* imports,
# and it contains no souk code at all — its dependencies are httpx,
# websockets, pydantic and litellm. AGPL here would protect nothing and
# deter everyone.
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # The KYOK LLM provider's socket (WS /ws/kyok — frame protocol
    # authored in the gateway repo's docs/server-mode.md).
    "websockets>=13",
    "pydantic>=2.9",
    # Only used by souk_client_sdk.kyok_bridge (Keep Your Own Key) — one
    # unified async interface across LLM providers, with streaming chunks
    # already OpenAI-shaped, matching souk's /kyok/v1 wire format exactly.
    "litellm>=1.95",
    # The LLM-provider contract upstream states: the Ed25519 identity a
    # KYOK provider registers and connects with, and the ticket-handshake
    # payloads. The old two SDK packages merged; the LLM half is the
    # `llm` extra (`funduq_provider_sdk.llm`). Apache-2.0, like this
    # package.
    "funduq-provider-sdk[llm]>=0.0.7,<0.1",
    # The AG-UI wire model both ends of every run frame validate against.
    # Pinned with a floor here, and not left to whatever each subproject's
    # lock happened to resolve: `funduq-contract` floors it at >=0.1, and
    # 0.1.22 made `RunAgentInput.state` optional-and-omitted-when-unset
    # while 0.1.19 still requires it — so a gateway on one and a provider
    # on the other disagree about a frame neither contract revision nor
    # any test in one process can catch. It cost a full stack run to find
    # (funduq#243).
    "ag-ui-protocol>=0.1.22",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["souk_client_sdk"]
